<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>130% Bonus + Free Bet up to ₹20,000 — Code INC130</title>
<meta name="description" content="Real matches, exact odds. Bet in under 2 minutes, withdraw in under 1 — UPI / PhonePe / Paytm. 130% bonus + free bet up to ₹20,000 with code INC130.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@500;600;700&family=Hind:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0d13;
    --bg-2:#10131c;
    --card:#151923;
    --card-2:#1b2130;
    --line:#242b3c;
    --odd:#222941;
    --blue:#2f6bff;
    --blue-h:#2861e8;
    --gold:#e8a33d;
    --red:#e5484d;
    --green:#35c66b;
    --text:#f2f4f8;
    --muted:#8b93a7;
    --hfont:'Khand','Hind',system-ui,sans-serif;
    --bfont:'Hind',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{
    font-family:var(--bfont);
    background:var(--bg);color:var(--text);
    line-height:1.55;overflow-x:hidden;
  }
  h1,h2,h3,h4,.btn,.lang-pill{font-family:var(--hfont)}
  a{text-decoration:none;color:inherit}
  button{font-family:inherit}
  .wrap{max-width:1140px;margin:0 auto;padding:0 20px}

  /* ---------- ticker ---------- */
  .ticker{
    background:var(--bg-2);border-bottom:1px solid var(--line);
    font-size:.84rem;padding:8px 0;text-align:center;color:var(--muted);
  }
  .ticker b{color:var(--gold)}

  /* ---------- header ---------- */
  header{
    position:sticky;top:0;z-index:50;
    background:rgba(11,13,19,.94);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .nav{display:flex;align-items:center;gap:16px;height:60px}
  .lang-switch{
    display:flex;background:var(--card);border:1px solid var(--line);
    border-radius:10px;padding:3px;gap:2px;
  }
  .lang-pill{
    border:0;background:transparent;color:var(--muted);cursor:pointer;
    font-size:.85rem;font-weight:600;padding:5px 13px;border-radius:8px;
    transition:background .15s,color .15s;
  }
  .lang-pill.active{background:var(--blue);color:#fff}
  .nav-cta{margin-left:auto;display:flex;gap:10px}
  .btn{
    display:inline-block;border-radius:10px;font-weight:600;cursor:pointer;
    padding:9px 22px;font-size:1.02rem;letter-spacing:.01em;border:0;text-align:center;
    transition:background .15s,transform .12s,border-color .15s;
  }
  .btn:active{transform:scale(.98)}
  .btn-blue{background:var(--blue);color:#fff}
  .btn-blue:hover{background:var(--blue-h)}
  .btn-ghost{background:transparent;color:var(--text);border:1.5px solid var(--line)}
  .btn-ghost:hover{border-color:var(--muted)}
  .btn-gold{background:var(--gold);color:#221503}
  .btn-gold:hover{background:#f0b154}
  .btn-lg{padding:13px 32px;font-size:1.05rem}

  /* ---------- offer banner ---------- */
  .offer-bar{
    margin-top:22px;
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--gold);
    border-radius:12px;padding:16px 20px;
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  }
  .offer-bar .ob-text{flex:1;min-width:220px}
  .offer-bar h3{font-size:1.15rem;font-weight:700;line-height:1.3}
  .offer-bar p{color:var(--muted);font-size:.88rem}
  .code-chip{
    display:inline-block;background:rgba(232,163,61,.12);border:1px dashed rgba(232,163,61,.55);
    color:var(--gold);font-weight:800;letter-spacing:.1em;
    border-radius:8px;padding:7px 14px;font-size:.95rem;cursor:pointer;white-space:nowrap;
  }

  /* ---------- hero : most placed bets ---------- */
  /* hero bg image: add url('images/hero.jpg') center/cover behind a dark gradient */
  .hero{padding:34px 0 56px}
  .hero h1{
    font-size:clamp(2rem,4.2vw,3rem);font-weight:700;line-height:1.15;
  }
  .hero .sub{color:var(--muted);max-width:640px;margin-top:6px;font-size:1rem}
  .stat-row{
    display:flex;flex-wrap:wrap;margin:20px 0 26px;
    background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;
  }
  .stat{
    flex:1;min-width:150px;padding:13px 18px;font-size:.9rem;color:var(--muted);
    border-right:1px solid var(--line);white-space:nowrap;
  }
  .stat:last-child{border-right:0}
  .stat b{color:var(--text);font-weight:700}
  .bet-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .bcard{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:16px 18px;cursor:pointer;transition:border-color .15s;
  }
  .bcard:hover{border-color:#37405a}
  .b-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .b-path{color:var(--muted);font-size:.8rem}
  .b-star{flex:none;width:18px;height:18px;stroke:var(--muted);opacity:.7;margin-top:2px}
  .b-meta{color:var(--muted);font-size:.8rem;margin-top:2px;display:flex;align-items:center;gap:7px}
  .b-live{color:var(--text)}
  .b-live::before{
    content:"";display:inline-block;width:7px;height:7px;border-radius:50%;
    background:var(--red);margin-right:1px;animation:blink 1.4s infinite;
  }
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
  .b-teams{margin:12px 0 14px;display:grid;gap:6px}
  .b-team{display:flex;justify-content:space-between;font-weight:600;font-size:.98rem}
  .b-score{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
  .b-odds{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:10px}
  .odd{
    background:var(--odd);border:0;border-radius:9px;padding:11px 8px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:9px;
    transition:background .15s;
  }
  .odd:hover{background:#2a3350}
  .odd span{color:var(--muted);font-size:.9rem}
  .odd b{color:var(--text);font-size:1rem;font-variant-numeric:tabular-nums}
  .odd.sel{background:var(--blue)}
  .odd.sel span{color:rgba(255,255,255,.75)}
  .odd.sel b{color:#fff}
  .odd.up{animation:oddUp 1.6s ease-out}
  .odd.down{animation:oddDown 1.6s ease-out}
  @keyframes oddUp{0%{background:rgba(53,198,107,.55)}100%{background:var(--odd)}}
  @keyframes oddDown{0%{background:rgba(229,72,77,.55)}100%{background:var(--odd)}}
  .bets-foot{margin-top:18px;text-align:center}

  /* ---------- sections ---------- */
  section{padding:56px 0}
  .sec-h{margin-bottom:26px}
  .sec-h h2{font-size:clamp(1.6rem,3.2vw,2.3rem);font-weight:700;line-height:1.15}
  .sec-h p{color:var(--muted);margin-top:4px;max-width:620px}

  /* ---------- speed ---------- */
  .speed{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .speed-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:16px}
  .steps{display:grid;gap:12px}
  .step{
    background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;display:flex;gap:14px;align-items:flex-start;
  }
  .step .n{
    flex:none;width:32px;height:32px;border-radius:9px;background:var(--odd);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--hfont);font-weight:800;color:var(--blue);font-size:1rem;
  }
  .step h4{font-size:1rem;font-weight:700}
  .step p{color:var(--muted);font-size:.88rem}
  .wd-card{
    background:var(--card);border:1px solid var(--line);border-left:3px solid var(--green);
    border-radius:12px;padding:20px;display:flex;flex-direction:column;
  }
  .wd-card .wd-time{
    font-family:var(--hfont);font-size:2.7rem;font-weight:700;color:var(--green);line-height:1;
  }
  .wd-card h3{font-size:1.05rem;font-weight:700;margin-top:2px}
  .wd-card p{color:var(--muted);font-size:.88rem;margin-top:6px;flex:1}
  .pay-tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
  .pay-tag{
    background:var(--odd);border-radius:8px;padding:6px 13px;
    font-size:.82rem;font-weight:700;color:var(--text);
  }

  /* ---------- games ---------- */
  .game-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
  .game{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:18px;min-height:150px;display:flex;flex-direction:column;
    cursor:pointer;position:relative;overflow:hidden;transition:border-color .15s;
  }
  .game:hover{border-color:#37405a}
  .game::after{
    content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;
    border-radius:50%;filter:blur(34px);opacity:.5;
  }
  /* game art: swap ::after glow for url('images/<game>.jpg') center/cover + dark gradient */
  .game.c-red::after{background:#e5484d}
  .game.c-green::after{background:#2f9e5f}
  .game.c-blue::after{background:#2f6bff}
  .game.c-amber::after{background:#e8a33d}
  .g-badge{
    align-self:flex-start;font-size:.7rem;font-weight:700;letter-spacing:.05em;
    color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:3px 10px;margin-bottom:auto;position:relative;z-index:1;
  }
  .game h3{font-size:1.15rem;font-weight:800;margin-top:18px;position:relative;z-index:1}
  .game p{color:var(--muted);font-size:.82rem;position:relative;z-index:1}

  /* ---------- promos ---------- */
  .promos{background:var(--bg-2);border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  .promo-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
  .promo{
    background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:22px;display:flex;flex-direction:column;
  }
  .promo.hot{border-color:rgba(232,163,61,.5)}
  .promo h3{font-size:1.12rem;font-weight:800}
  .promo p{color:var(--muted);font-size:.88rem;margin-top:4px;flex:1}
  .promo .p-code{
    margin:16px 0 12px;display:flex;align-items:center;justify-content:space-between;
    background:var(--odd);border-radius:9px;padding:10px 14px;
  }
  .promo .p-code span{font-weight:800;letter-spacing:.1em;color:var(--gold)}
  .promo .p-code button{
    background:none;border:0;color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer;
  }
  .promo .p-code button:hover{color:var(--text)}

  /* ---------- final ---------- */
  .final{text-align:center}
  .final h2{font-size:clamp(1.7rem,3.4vw,2.5rem);font-weight:700}
  .final p{color:var(--muted);margin:8px auto 22px;max-width:480px}

  /* ---------- footer ---------- */
  footer{
    border-top:1px solid var(--line);background:var(--bg-2);
    padding:26px 0;text-align:center;color:var(--muted);font-size:.82rem;
  }
  footer .age{
    display:inline-flex;align-items:center;justify-content:center;
    width:36px;height:36px;border-radius:50%;border:2px solid var(--red);
    color:var(--red);font-weight:800;font-size:.8rem;margin-bottom:10px;
  }
  footer p{margin-top:2px}

  /* ---------- mobile sticky CTA ---------- */
  .mobile-cta{
    display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
    padding:10px 14px calc(12px + env(safe-area-inset-bottom));
    background:rgba(11,13,19,.97);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);
  }
  .mobile-cta .btn{width:100%;padding:13px;font-size:1rem}
  .mc-note{text-align:center;font-size:.72rem;color:var(--muted);margin-top:5px}
  .mc-note b{color:var(--gold)}

  /* ---------- responsive ---------- */
  @media(max-width:900px){
    .bet-grid{grid-template-columns:1fr}
    .speed-grid{grid-template-columns:1fr}
    .game-grid,.promo-grid{grid-template-columns:1fr 1fr}
    .stat{min-width:46%}
    .stat:nth-child(2){border-right:0}
  }
  @media(max-width:600px){
    body{padding-bottom:88px}
    section{padding:44px 0}
    .hero{padding:24px 0 44px}
    .game-grid,.promo-grid{grid-template-columns:1fr}
    .nav-cta .btn-ghost{display:none}
    .mobile-cta{display:block}
    .stat{min-width:100%;border-right:0;border-bottom:1px solid var(--line);padding:10px 16px}
    .stat:last-child{border-bottom:0}
    .offer-bar .btn{width:100%}
  }
</style>
</head>

        if(ov !== null && Number(o.value) !== ov) flash[i][j] = Number(o.value) > ov ? 'up' : 'down';
      });
    });
    BETS = bets;
    renderBets(flash);
  }

  function pollFeed(){
    fetch(FEED_URL + (FEED_URL.indexOf('?') < 0 ? '?' : '&') + 't=' + Date.now(), {cache:'no-store'})
      .then(function(r){ return r.ok ? r.json() : Promise.reject(); })
      .then(function(d){ if(d && d.bets && d.bets.length) applyFeed(d.bets); })
      .catch(function(){ /* feed unreachable: keep showing current odds */ });
  }
  setInterval(pollFeed, POLL_MS);
  pollFeed();

  /* ================= CTA -> registration ================= */
  document.addEventListener('click', function(e){
    var t = e.target.closest('[data-signup]');
    if(t){ e.preventDefault(); window.location.href = REG_URL; }
  });

  /* ================= copy code ================= */
  function copyCode(code, el){
    navigator.clipboard.writeText(code).then(function(){
      var old = el.textContent;
      el.textContent = T[lang].copied;
      setTimeout(function(){ el.textContent = old; }, 1500);
    });
  }

  /* init */
  var qs = null;
  try{ qs = new URLSearchParams(location.search).get('lang'); }catch(e){}
  var saved = null;
  try{ saved = localStorage.getItem('lang'); }catch(e){}
  setLang(qs || 'en');
</script>
</body>
</html>
